services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      MAX_SESSIONS: ${MAX_SESSIONS:-128}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 2
    pids_limit: 128
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,uid=101,gid=101
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 1
    pids_limit: 64
